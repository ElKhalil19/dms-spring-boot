apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comments
  template:
    metadata:
      labels:
        app: comments
    spec:
      containers:
        - name: comments
          image: dms-comments:latest
          ports:
            - containerPort: 8083
          env:
            - name: CASSANDRA_CONTACT_POINTS
              value: cassandra
---
apiVersion: v1
kind: Service
metadata:
  name: comments
spec:
  selector:
    app: comments
  ports:
    - port: 8083
      targetPort: 8083
