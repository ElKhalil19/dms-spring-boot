---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-deployment
  namespace: default
  labels:
    app: documents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documents
  template:
    metadata:
      labels:
        app: documents
    spec:
      containers:
        - name: documents
          image: documents:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: dms-config
            - secretRef:
                name: dms-secrets
          readinessProbe:
            httpGet:
              path: /documents/list
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /documents/list
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
  namespace: default
spec:
  selector:
    app: documents
  ports:
    - port: 8081
      targetPort: 8081
