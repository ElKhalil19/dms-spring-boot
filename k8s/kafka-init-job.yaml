apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  template:
    spec:
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.6.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              kafka-topics --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic dms.documents.uploaded \
                --partitions 3 \
                --replication-factor 1
              echo "Topic created"
      restartPolicy: OnFailure
