apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: s3
          image: dms-s3:latest
          ports:
            - containerPort: 8010
          env:
            - name: APP_S3_ENDPOINT
              value: http://minio:9000
            - name: APP_S3_REGION
              value: us-east-1
            - name: APP_S3_ACCESS_KEY
              value: admin
            - name: APP_S3_SECRET_KEY
              value: ensia123456
            - name: APP_S3_BUCKET
              value: ensue
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 8010
      targetPort: 8010
