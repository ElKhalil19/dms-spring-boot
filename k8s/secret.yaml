apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: default
type: Opaque
# IMPORTANT: Replace the values below with actual secrets before deploying.
# Do NOT commit real secrets to version control.
# Recommended: Use a secrets manager (e.g., Vault, AWS Secrets Manager) to inject these.
stringData:
  SPRING_DATASOURCE_PASSWORD: "<REPLACE_WITH_DB_PASSWORD>"
  JWT_SECRET: "<REPLACE_WITH_SECRET_AT_LEAST_32_CHARACTERS>"
  APP_S3_ACCESS_KEY: "<REPLACE_WITH_S3_ACCESS_KEY>"
  APP_S3_SECRET_KEY: "<REPLACE_WITH_S3_SECRET_KEY>"
