server {
    listen 80;
    server_name localhost;

    # 1. Serve your React/Vue/Angular static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This fixes 404 errors when you refresh the page in a Single Page App
        try_files $uri $uri/ /index.html; 
    }

    # 2. Forward API requests to your Spring Boot backend
    location /api/ {
        # IMPORTANT: "documents" must exactly match your backend service name in docker-compose.yml
        # 8081 must match the port Spring Boot is running on
        proxy_pass http://documents:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}